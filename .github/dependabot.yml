# Basic `dependabot.yml` file with
# minimum configuration for three package managers

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # Enable version updates for cargo
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    groups:
      # Both crates come from the same forestat-server-deps Git revision. Updating
      # them separately creates duplicate Cargo.lock PRs and can leave the
      # update stream blocked behind one stale PR.
      forestat-server-deps:
        patterns:
          - "aw-server"
          - "aw-datastore"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
